name: ci
on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  merge_group:
    branches: [main, develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
