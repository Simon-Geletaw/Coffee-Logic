name: ci
on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  merge_group:
    branches: [main, develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm ci
      - run: pnpm -C apps/web run lint
      - run: pnpm -C apps/api run lint

      - run: pnpm run typecheck
      - run: pnpm run build
