name: CI/CD

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  merge_group:
    branches: [main, develop, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is a pnpm workspace (pnpm-workspace.yaml) — npm cannot install it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API (prisma generate + nest build)
        run: pnpm -C apps/api run build

      - name: Verify API emits dist/main.js
        run: test -f apps/api/dist/main.js

      - name: Typecheck web
        run: pnpm -C apps/web run typecheck

      - name: Build web
        run: pnpm -C apps/web run build

      - name: Lint web
        run: pnpm -C apps/web run lint

  # Set these repo secrets to enable automatic deploys on push to main/develop:
  #   RAILWAY_TOKEN + (optionally) RAILWAY_SERVICE
  deploy:
    needs: build
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Deploy to Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          npm install -g @railway/cli
          railway up --service "${RAILWAY_SERVICE:-api}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}

