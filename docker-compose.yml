services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee_logic
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    ports:
      - "7000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  postgres_data:
