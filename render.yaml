services:
  # Backend API (NestJS). The root directory stays at the repo root on purpose:
  # the pnpm workspace files (pnpm-workspace.yaml, pnpm-lock.yaml), the shared
  # Prisma schema (prisma/schema.prisma) and prisma.config.ts all live there,
  # and Render does NOT make files outside a service's root directory available
  # at build/runtime. Setting "apps/api" here would break prisma generate.
  - type: web
    name: coffee-logic-api
    runtime: node
    buildCommand: npm i -g pnpm@11.5.1 && pnpm install --frozen-lockfile && pnpm -C apps/api run build
    # prisma migrate deploy is idempotent, so it is safe to run on every boot
    # (also after a free-instance wake-up from spin-down).
    startCommand: pnpm -C apps/api exec prisma migrate deploy --schema ../../prisma/schema.prisma && pnpm -C apps/api run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically (defaults to 10000); src/main.ts
      # already binds to process.env.PORT on 0.0.0.0.
      - key: DATABASE_URL
        sync: false # Render Postgres Internal Database URL (postgres:// is accepted)
      - key: JWT_SECRET
        sync: false # EXACTLY 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: WEB_ORIGIN
        sync: false # e.g. https://your-frontend.onrender.com (used for CORS)
      - key: API_PUBLIC_URL
        sync: false # e.g. https://coffee-logic-api.onrender.com (payment webhook/callback URLs)
      - key: REDIS_URL
        sync: false # REQUIRED in production (Render Key Value internal URL, redis://...)
      - key: CHAPA_SECRET_KEY
        sync: false # REQUIRED in production (CHASECK_...)
      - key: CHAPA_WEBHOOK_SECRET
        sync: false # REQUIRED in production
      - key: NODE_ENV
        value: production